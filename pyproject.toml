[project]
name = "ai-automation"
version = "0.1.0"
description = "Industrial Controls Release Assurance platform (air-gapped)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "instructor>=1.15.4",
    "litellm>=1.93.0",
    "voyageai>=0.3.0",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Map backend/app -> importable package `app` (editable-friendly).
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build.targets.wheel.sources]
"backend/app" = "app"
